# Публикация сайта на GitHub Pages: код из main + данные из ветки data.
name: Публикация сайта
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Не отменяем идущую публикацию: во время матча новые приходят каждую минуту,
  # и отмена могла бы не дать завершиться ни одной. Ждёт максимум одна — самая свежая.
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Подложить данные из ветки data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci_restore_data.sh
      - name: Проставить версию кода сайта
        # Pages разрешает браузерам хранить файлы 10 мин. Версия в адресах (css/app.css?v=…, импорты
        # модулей) заставляет после обновления кода загрузить все файлы заново и одной версии.
        # Публикации только с новыми данными версию не меняют — код берётся из кэша.
        run: |
          V="${GITHUB_SHA::8}"
          find site -type f \( -name '*.js' -o -name '*.html' -o -name '*.css' \) -not -path 'site/data/*' -print0 \
            | xargs -0 sed -i "s/__V__/$V/g"
          if grep -rl --include='*.js' --include='*.html' --include='*.css' "__V__" site; then exit 1; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
