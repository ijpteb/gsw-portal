# Сбор данных.
# GitHub запускает задачи по расписанию нерегулярно: cron «каждые 5 минут» на этом репозитории
# срабатывал примерно раз в час (замер 11.11.2026). Поэтому каждый запуск «дежурит» непрерывно:
# раз в минуту сборщик проверяет, что пора обновить (матч — каждую минуту, день матча — 5 мин,
# новости — 20 мин, таблица/статистика/состав — час), и публикует изменения.
# Когда GitHub ставит в очередь следующий запуск (по расписанию или вручную), текущий
# передаёт ему дежурство — так подхватывается и новый код. Запуски идут строго по одному.
name: Сбор данных
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Обновить всё прямо сейчас"
        type: boolean
        default: false
permissions:
  contents: write   # сохранить данные в ветку data
  actions: write    # запустить публикацию сайта и следующий запуск сбора
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # дежурство — до 320 мин (GitHub разрешает задачу до 6 ч)
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Восстановить сохранённые данные
        run: bash scripts/ci_restore_data.sh
      - name: Дежурство — обновлять данные, пока не придёт следующий запуск
        run: >-
          python3 -m collector loop
          --max-minutes 320
          --after-update "bash scripts/ci_publish.sh"
          --handover "bash scripts/ci_newer_run.sh"
          --exit-reason-file "$RUNNER_TEMP/loop-exit"
          ${{ inputs.force && '--force' || '' }}
      - name: Время вышло, а смены нет — запустить её самим
        run: |
          if [ "$(cat "$RUNNER_TEMP/loop-exit" 2>/dev/null)" = "time" ] && ! bash scripts/ci_newer_run.sh; then
            echo "Следующего запуска в очереди нет — ставлю его сам."
            gh workflow run collect.yml --ref "$GITHUB_REF_NAME"
          else
            echo "Следующий запуск уже ждёт своей очереди."
          fi
